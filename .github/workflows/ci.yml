name: CI

on:
  push:
    branches:
      - develop
      - staging
      - production
      - gh-readonly-queue/**
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '__tests__/e2e/**'
      - 'search/search-dev-tools/build/**'
      - 'search/search-dev-tools/src/**'
      - 'search/search-dev-tools/tests/**'
      - 'search/search-dev-tools/*.js'
      - 'search/search-dev-tools/*.json'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '__tests__/e2e/**'
      - 'search/search-dev-tools/build/**'
      - 'search/search-dev-tools/src/**'
      - 'search/search-dev-tools/tests/**'
      - 'search/search-dev-tools/*.js'
      - 'search/search-dev-tools/*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-cache-contention:
    name: Shared-cache contention (Memcached)
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
    env:
      VIP_TEST_MEMCACHED_SERVER: 127.0.0.1:11211
      VIP_TEST_REQUIRE_SHARED_CACHE: '1'
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Prepare source code
        uses: ./.github/actions/prepare-source

      - name: Run shared-cache worker test
        uses: ./.github/actions/run-wp-tests
        with:
          php: '8.2'
          extensions: memcached
          test-filter: 'Test_Concurrency_Shared_Cache::test_two_workers_share_atomic_counter'
        timeout-minutes: 15

  unit-tests:
    name: "WP ${{ matrix.config.wp }}, multisite: ${{ matrix.config.ms }}, JP: ${{ matrix.config.jp }}, PHP: ${{ matrix.config.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        # PHP 8.2
          - { wp: 6.5.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.5.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.6.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.6.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.7.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.7.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.8.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.8.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.9.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 6.9.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 7.0.x,   ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: 7.0.x,   ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: latest,  ms: 'no',  jp: 'yes', php: '8.2', phpunit: '', coverage: 'yes' }
          - { wp: latest,  ms: 'yes', jp: 'yes', php: '8.2', phpunit: '', coverage: 'yes' }
          - { wp: nightly, ms: 'no',  jp: 'yes', php: '8.2', phpunit: '' }
          - { wp: nightly, ms: 'yes', jp: 'yes', php: '8.2', phpunit: '' }
        # PHP 8.2, no JP
          - { wp: latest,  ms: 'no',  jp: 'no', php: '8.2', phpunit: '', coverage: 'yes' }
          - { wp: latest,  ms: 'yes', jp: 'no', php: '8.2', phpunit: '', coverage: 'yes' }
        # PHP 8.2 covers every tested WordPress version. Newer PHP versions run against only the
        # oldest and the latest WordPress versions tested with them.
        # PHP 8.3
          - { wp: 6.5.x,   ms: 'no',  jp: 'yes', php: '8.3', phpunit: '' }
          - { wp: 6.5.x,   ms: 'yes', jp: 'yes', php: '8.3', phpunit: '' }
          - { wp: latest, ms: 'no',  jp: 'yes', php: '8.3', phpunit: '' }
          - { wp: latest, ms: 'yes', jp: 'yes', php: '8.3', phpunit: '' }
        # PHP 8.4
          - { wp: 6.7.x,   ms: 'no',  jp: 'yes', php: '8.4', phpunit: '' }
          - { wp: 6.7.x,   ms: 'yes', jp: 'yes', php: '8.4', phpunit: '' }
          - { wp: latest, ms: 'no',  jp: 'yes', php: '8.4', phpunit: '' }
          - { wp: latest, ms: 'yes', jp: 'yes', php: '8.4', phpunit: '' }
        # PHP 8.5
          - { wp: latest, ms: 'no',  jp: 'yes', php: '8.5', phpunit: '' }
          - { wp: latest, ms: 'yes', jp: 'yes', php: '8.5', phpunit: '' }
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        env:
          # Clone submodules in parallel instead of one at a time.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: submodule.fetchJobs
          GIT_CONFIG_VALUE_0: 8
        with:
          submodules: recursive

      - name: Prepare source code
        uses: ./.github/actions/prepare-source

      - name: Run tests
        uses: ./.github/actions/run-wp-tests
        with:
          wordpress: ${{ matrix.config.wp }}
          multisite: ${{ matrix.config.ms }}
          jetpack: ${{ matrix.config.jp }}
          php: ${{ matrix.config.php }}
          phpunit: ${{ matrix.config.phpunit }}
          coverage: ${{ matrix.config.coverage }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
        timeout-minutes: 15
