name: CI (WP Core)

on:
  push:
    branches:
      - develop
      - staging
      - production
      - gh-readonly-queue/**
  pull_request:
    branches:
      - develop
  schedule:
    # The external HTTP tests depend on third-party hosts, so they run daily instead of on every change.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  # The event keeps a push to develop from cancelling the scheduled run, and the other way round.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LOCAL_PHP: "8.2-fpm"
  LOCAL_PHP_XDEBUG: "false"
  LOCAL_PHP_XDEBUG_MODE: "develop,debug"
  LOCAL_DB_TYPE: "mysql"
  LOCAL_DB_VERSION: "8.3"
  LOCAL_PHP_MEMCACHED: "true"
  LOCAL_WP_TESTS_DOMAIN: "example.org"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - name: Check out the change detection action
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions/detect-changes
          persist-credentials: false

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  wp-core:
    name: "Run WP Core Tests: ${{ matrix.suite }}${{ matrix.shard && format(' {0}/3', matrix.shard) || '' }}"
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The main suite took over 10 minutes in one job, so it runs in three shards. The group runs get
        # their own job.
        include:
          - { suite: main, shard: 1 }
          - { suite: main, shard: 2 }
          - { suite: main, shard: 3 }
          - { suite: groups }
    steps:
      - name: Get the latest WP version
        id: version
        run: |
          echo "latest=$(curl -s https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers | map(select( .response == "upgrade")) | .[0].version')" >> $GITHUB_OUTPUT

      - name: Configure environment variables
        run: |
          echo "PHP_FPM_UID=$(id -u)" >> "${GITHUB_ENV}"
          echo "PHP_FPM_GID=$(id -g)" >> "${GITHUB_ENV}"

      - name: Checkout WordPress
        uses: actions/checkout@v7.0.1
        with:
          repository: wordpress/wordpress-develop
          path: wordpress
          ref: ${{ steps.version.outputs.latest }}

      - name: Fix WPCS version
        run: |
          sed -i 's!"wp-coding-standards/wpcs": "~3.3.0"!"wp-coding-standards/wpcs": "~3.4.1"!' wordpress/composer.json

      - name: Check out source code
        uses: actions/checkout@v7.0.1
        env:
          # Clone submodules in parallel instead of one at a time.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: submodule.fetchJobs
          GIT_CONFIG_VALUE_0: 8
        with:
          submodules: recursive
          path: wordpress/src/wp-content/mu-plugins

      - name: Tweaks
        run: |
          echo "define( 'VIP_JETPACK_SKIP_LOAD', 'true' );" >> "wordpress/src/wp-content/mu-plugins/000-vip-init.php"
          cp wordpress/.env.example wordpress/.env
          echo "GITHUB_EVENT_NAME=pull_request" >> "wordpress/.env"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'wordpress/.nvmrc'

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.0
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: wordpress

      # The local environment scripts only need the few packages they require. `npm ci` would install all of
      # wordpress-develop's build tooling, which took ~30s, so it's only the fallback for a script requiring a
      # package that package.json doesn't list. Neither runs the packages' install scripts, which none of
      # these scripts needs.
      - name: Install npm dependencies
        run: |
          # shellcheck disable=SC2016,SC2086 # The JavaScript is single-quoted; `packages` has one package per word.
          if packages=$(node -e '
            const fs = require( "fs" );
            const { isBuiltin } = require( "module" );
            const { dependencies = {}, devDependencies = {} } = require( "./package.json" );
            const versions = { ...dependencies, ...devDependencies };
            const dir = "tools/local-env/scripts";
            const names = new Set();
            for ( const file of fs.readdirSync( dir ).filter( ( name ) => name.endsWith( ".js" ) ) ) {
              for ( const [ , id ] of fs.readFileSync( `${ dir }/${ file }`, "utf8" ).matchAll( /require\(\s*["\x27]([^"\x27]+)["\x27]\s*\)/g ) ) {
                if ( ! id.startsWith( "." ) && ! isBuiltin( id ) ) {
                  names.add( id.split( "/" ).slice( 0, id.startsWith( "@" ) ? 2 : 1 ).join( "/" ) );
                }
              }
            }
            for ( const name of names ) {
              if ( ! versions[ name ] ) {
                console.error( `${ name } is not in package.json` );
                process.exit( 1 );
              }
              console.log( `${ name }@${ versions[ name ] }` );
            }
          ') && [ -n "${packages}" ] && npm install --prefix "${RUNNER_TEMP}/wp-env" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund ${packages}; then
            ln -s "${RUNNER_TEMP}/wp-env/node_modules" node_modules
          else
            npm ci --ignore-scripts
          fi
        working-directory: wordpress

      - name: Start Docker environment
        run: npm run env:start
        working-directory: wordpress

      - name: Log running Docker containers
        run: docker ps -a

      - name: WordPress Docker container debug information
        run: |
          docker compose run --rm mysql mysql --version
          docker compose run --rm php php --version
          docker compose run --rm php php -m
          docker compose run --rm php php -i
          docker compose run --rm php locale -a
        working-directory: wordpress

      - name: Install WordPress
        run: npm run env:install
        working-directory: wordpress

      # Core's bootstrap reinstalls the test site in every process-isolated test. Its tear_down() calls
      # wp_set_current_user() after the ROLLBACK, and the MU plugins' `set_current_user` callback reads
      # the users table, so the parent held a lock that the child's DROP TABLE waited on forever.
      # So each PHPUnit step installs the test site once and runs its tests with WP_TESTS_SKIP_INSTALL, as
      # tests/class-speedup-isolated-wp-tests.php does. The install is a run that matches no tests: only the
      # bootstrap runs, and it passes install.php the arguments that the configuration calls for.
      #
      # PHPUnit wraps a filter that isn't a delimited regex in /.../i and keeps its special characters,
      # so the lookahead must not be escaped. An escaped `\(` matched nothing and ran no tests.
      - name: Run PHPUnit tests
        if: matrix.suite == 'main'
        run: |
          # Excluded tests:
          # - a8c-files.php disables big image scaling, so PNGs are never scaled down.
          # - The bundled Akismet adds `wordpress_api_key` to the REST settings.
          # - Script module files come from the Gutenberg build, which this job doesn't download.
          excluded='test_wp_generate_attachment_metadata_png_thumbnail_smaller_than_original'
          excluded+='|WP_Test_REST_Settings_Controller::test_get_items$'
          excluded+='|test_default_script_module_files_exist'

          # Shards split the test classes by name, balanced on measured run time. Shard 3 takes every class
          # the first two don't match, so a new or renamed class always runs. PHPUnit matches case-insensitively.
          shard1='WP_|Tests_[defgv]'
          shard2='Tests_[cmnoruwx]'
          case "${SHARD}" in
            1) classes="(?=${shard1})" ;;
            2) classes="(?!${shard1})(?=${shard2})" ;;
            3) classes="(?!${shard1})(?!${shard2})" ;;
            *) echo "Unknown shard: ${SHARD}" >&2; exit 1 ;;
          esac

          # Core's tests stand in for built files this job doesn't build with empty files (self::touch()), and
          # some tests only pass because an earlier class created one: Tests_Embed_Template needs the
          # wp-embed.js from the oEmbed classes. Create them all up front, so each shard has what one full run
          # would.
          grep -rhoE "self::touch\( ABSPATH \. WPINC \. '[^']+'" tests/phpunit/tests | sed -E "s/.*'([^']+)'$/\1/" | sort -u |
            while read -r file; do
              mkdir -p "src/wp-includes$(dirname "${file}")"
              touch "src/wp-includes${file}"
            done

          node ./tools/local-env/scripts/docker.js run php ./vendor/bin/phpunit -c phpunit.xml.dist --filter '^$'
          node ./tools/local-env/scripts/docker.js run -e WP_TESTS_SKIP_INSTALL=1 php ./vendor/bin/phpunit \
            --verbose -c phpunit.xml.dist \
            --filter "^${classes}(?!.*(${excluded})).*\$"
        env:
          SHARD: ${{ matrix.shard }}
        working-directory: wordpress
        timeout-minutes: 20

      # These install the test site once, too; see "Run PHPUnit tests".
      - name: Run AJAX tests
        if: matrix.suite == 'groups'
        run: |
          node ./tools/local-env/scripts/docker.js run php ./vendor/bin/phpunit -c phpunit.xml.dist --filter '^$'
          node ./tools/local-env/scripts/docker.js run -e WP_TESTS_SKIP_INSTALL=1 php ./vendor/bin/phpunit --verbose -c phpunit.xml.dist --group ajax
        working-directory: wordpress
        timeout-minutes: 15

      - name: Run ms-files tests as a multisite install
        if: matrix.suite == 'groups'
        run: |
          node ./tools/local-env/scripts/docker.js run php ./vendor/bin/phpunit -c tests/phpunit/multisite.xml --filter '^$'
          node ./tools/local-env/scripts/docker.js run -e WP_TESTS_SKIP_INSTALL=1 php ./vendor/bin/phpunit --verbose -c tests/phpunit/multisite.xml --group ms-files
        working-directory: wordpress
        timeout-minutes: 15

      - name: Run external HTTP tests
        if: matrix.suite == 'groups' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          node ./tools/local-env/scripts/docker.js run php ./vendor/bin/phpunit -c phpunit.xml.dist --filter '^$'
          node ./tools/local-env/scripts/docker.js run -e WP_TESTS_SKIP_INSTALL=1 php ./vendor/bin/phpunit --verbose -c phpunit.xml.dist --group external-http
        working-directory: wordpress
        timeout-minutes: 15
