name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_INITDB_SKIP_TZINFO: 1
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
    steps:
      - name: Check out source code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          coverage: none
          ini-values: apc.enable_cli=1, opcache.enable_cli=1
          php-version: 8.4
        env:
          fail-fast: 'true'

      - name: Install PHP Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Set up WordPress and WordPress Test Library
        uses: sjinks/setup-wordpress-test-library@v3.0.0
        with:
          version: latest

      - name: Verify MariaDB connection
        run: |
          echo Waiting for MySQL to come online...
          second=0
          while ! mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" --silent && [ "${second}" -lt 60 ]; do
            sleep 1
            second=$((second+1))
          done
          mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" --silent
        env:
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: 3306
