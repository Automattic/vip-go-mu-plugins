name: Run WP Tests
description: Runs WordPress plugin tests.
inputs:
  wordpress:
    description: The version of WordPress to use.
    required: false
    default: 'latest'
  multisite:
    description: Whether to run the tests in multisite mode.
    required: false
    default: 'no'
  jetpack:
    description: Whether to enable JetPack.
    required: false
    default: 'yes'
  php:
    description: The version of PHP to use.
    required: false
    default: '8.0'
  phpunit:
    description: The version of PHPUnit to use.
    required: false
    default: ''
  coverage:
    description: Whether to generate code coverage reports.
    required: false
    default: 'no'
  coverage-file:
    description: The file to write the code coverage report to.
    required: false
    default: 'clover.xml'
  coverage-flags:
    description: Coverage flags for CodeCov.
    required: false
    default: ''
  codecov-token:
    description: The token to use for CodeCov.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # The runner image ships MySQL; starting it takes a few seconds, whereas a `mysql` service
    # container took 13-16s to initialize. Start it now and wait for it right before the tests.
    - name: Start MySQL
      shell: bash
      run: sudo systemctl start --no-block mysql.service

    - name: Set up coverage reporting parameters
      id: coverage
      shell: bash
      run: |
        if [ "${COVERAGE}" = "yes" ] && [ -n "${COVERAGE_FILE}" ]; then
          echo "coverage=pcov" >> $GITHUB_OUTPUT
          echo 'ini=apc.enable_cli=1, pcov.directory=., pcov.exclude="~/(vendor|tests|node_modules|jetpack[^/]*|wp-parsely[^/]+|vip-integrations|advanced-post-cache|akismet|cron-control|drop-ins|http-concat|lightweight-term-count-update|query-monitor|(search/(elasticpress|debug-bar-elasticpress|es-wp-query))|shared-plugins|rewrite-rules-inspector|vaultpress|wordpress-importer)/~"' >> $GITHUB_OUTPUT
        else
          echo "coverage=none" >> $GITHUB_OUTPUT
          echo "ini=apc.enable_cli=1, opcache.enable_cli=0" >> $GITHUB_OUTPUT
        fi
      env:
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        coverage: ${{ steps.coverage.outputs.coverage }}
        ini-values: ${{ steps.coverage.outputs.ini }}
        php-version: ${{ inputs.php }}
      env:
        fail-fast: 'true'

    - name: Install PHPUnit
      shell: bash
      run: |
        wget -q -O /usr/local/bin/phpunit "https://phar.phpunit.de/phpunit-${PHPUNIT_VERSION}.phar"
        chmod +x /usr/local/bin/phpunit
      if: inputs.phpunit != ''
      env:
        PHPUNIT_VERSION: ${{ inputs.phpunit }}

    # Not ramsey/composer-install: its cache key hashes every composer.json in the workspace,
    # which takes ~10s once the mu-plugins-ext copies are in place.
    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "${GITHUB_OUTPUT}"

    - name: Cache Composer dependencies
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php-${{ inputs.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-php-${{ inputs.php }}-

    - name: Install PHP Dependencies
      shell: bash
      run: composer install --no-interaction --no-progress

    # The test library action needs Subversion only when the test library isn't cached yet, which is
    # always the case for nightly. Other versions try without it first; a failed first attempt
    # installs it and retries.
    - name: Set up WordPress and WordPress Test Library
      id: wptl
      if: inputs.wordpress != 'nightly' && inputs.wordpress != 'trunk'
      uses: sjinks/setup-wordpress-test-library@9726426f2a40656274560a0394718177f8adb424 # v3.0.0
      continue-on-error: true
      with:
        version: ${{ inputs.wordpress }}

    - name: Get Subversion package cache key
      id: svn-cache
      if: steps.wptl.outcome != 'success'
      shell: bash
      # An exact cache hit is never saved again, so key on the image version to pick up new packages.
      run: echo "key=svn-debs-${ImageOS}-${ImageVersion}" >> "${GITHUB_OUTPUT}"

    # Downloading the packages from the Ubuntu mirror took up to a minute.
    - name: Restore Subversion packages
      if: steps.wptl.outcome != 'success'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/svn-debs
        key: ${{ steps.svn-cache.outputs.key }}

    - name: Install svn
      if: steps.wptl.outcome != 'success'
      shell: bash
      run: |
        debs="${RUNNER_TEMP}/svn-debs"
        if ! sudo dpkg -i "${debs}"/*.deb; then
          # No cached packages, or they no longer fit the runner image: download them again.
          rm -rf "${debs}"
          mkdir -p "${debs}/partial"
          sudo apt-get update
          sudo apt-get install -y -f --no-install-recommends -o Dir::Cache::archives="${debs}" subversion
        fi

    - name: Set up WordPress and WordPress Test Library (with svn)
      if: steps.wptl.outcome != 'success'
      uses: sjinks/setup-wordpress-test-library@9726426f2a40656274560a0394718177f8adb424 # v3.0.0
      with:
        version: ${{ inputs.wordpress }}

    - name: Set up multisite mode
      shell: bash
      run: echo "WP_MULTISITE=1" >> $GITHUB_ENV
      if: inputs.multisite == 'yes'

    - name: Disable Jetpack
      shell: bash
      run: echo "VIP_JETPACK_SKIP_LOAD=1" >> $GITHUB_ENV
      if: inputs.jetpack == 'no'

    # The test library action configures WordPress for wordpress:wordpress@127.0.0.1/wordpress_test.
    # The runner image's MySQL root password is `root`.
    - name: Create the test database
      shell: bash
      run: |
        echo Waiting for MySQL to come online...
        second=0
        while ! mysqladmin ping -h 127.0.0.1 --silent && [ "${second}" -lt 60 ]; do
          sleep 1
          second=$((second+1))
        done
        mysql -h 127.0.0.1 -u root -proot -e "
          CREATE DATABASE IF NOT EXISTS wordpress_test;
          CREATE USER IF NOT EXISTS 'wordpress'@'%' IDENTIFIED BY 'wordpress';
          GRANT ALL PRIVILEGES ON wordpress_test.* TO 'wordpress'@'%';
        "

    - name: Run tests
      shell: bash
      run: |
        if [ -n "${PHPUNIT_VERSION}" ]; then
          PHPUNIT=phpunit
        else
          PHPUNIT=vendor/bin/phpunit
        fi
        OPTIONS=
        if [ "${COVERAGE}" != 'none' ]; then
          OPTIONS="${OPTIONS} --coverage-clover=clover.xml"
        else
          OPTIONS="${OPTIONS} --order-by=random"
        fi
        "${PHPUNIT}" ${OPTIONS}
      env:
        PHPUNIT_VERSION: ${{ inputs.phpunit }}
        COVERAGE: ${{ steps.coverage.outputs.coverage }}

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ${{ inputs.coverage-file }}
        flags: ${{ inputs.coverage-flags }}
        token: ${{ inputs.codecov-token }}
      if: ${{ steps.coverage.outputs.coverage != 'none' && inputs.codecov-token != '' }}
