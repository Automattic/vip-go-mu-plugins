name: Prepare source code for testing
description: Checks out and installs all dependencies
runs:
  using: composite
  steps:
    - name: Check out mu-plugins-ext
      uses: actions/checkout@v7.0.1
      with:
        repository: 'Automattic/vip-go-mu-plugins-ext'
        path: 'vip-go-mu-plugins-ext'
        persist-credentials: false

    - name: Copy plugins into the source tree
      shell: bash
      # Hard-link files from the checkout instead of copying ~500 MB of data.
      run: 'rsync -r --delete --link-dest="${PWD}/vip-go-mu-plugins-ext" --exclude-from="vip-go-mu-plugins-ext/.dockerignore" vip-go-mu-plugins-ext/* ./'

    - name: Clean up
      shell: bash
      # Moving the checkout out of the workspace is a rename on the same disk; `rm -rf` took 10-14s.
      run: mv vip-go-mu-plugins-ext "${RUNNER_TEMP}/"

